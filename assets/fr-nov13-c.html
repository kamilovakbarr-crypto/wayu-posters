<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<style>
@font-face{font-family:"AntonX";src:url("fonts/anton-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"AntonX";src:url("fonts/anton-latin-ext-400-normal.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#2a1456;--blue:#6a3fd0;--orange:#ff5a7a}
body{width:1080px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:var(--navy);
 background:linear-gradient(160deg,#f7f2ff 0%,#e6dcfb 55%,#d9cbf6 100%);position:relative}
.rings{position:absolute;right:-420px;top:-160px;width:1000px;height:1000px;pointer-events:none}
.rings i{position:absolute;border:3px solid rgba(0,0,0,.07);border-radius:50%}
.rings i:nth-child(1){inset:0}.rings i:nth-child(2){inset:140px}.rings i:nth-child(3){inset:280px}
.wrap{position:absolute;inset:0;padding:60px 66px}
.head{display:flex;align-items:center;gap:22px;height:82px}
.logo{height:82px;display:block}
.div{width:2px;height:62px;background:var(--navy);opacity:.85}
.org{font-weight:800;font-size:20px;line-height:1.2;letter-spacing:.2px;text-transform:uppercase}
.org em{display:block;font-style:normal;font-weight:300;letter-spacing:.4px;font-size:21px}
h1{font-family:AntonX,Impact,sans-serif;font-weight:400;font-size:150px;line-height:1.05;letter-spacing:1px;margin-top:36px;white-space:nowrap}
h1 span{display:inline-block;color:#fff;background:var(--orange);padding:0 22px;border-radius:14px;transform:rotate(-2.5deg);margin-left:6px}
.sub{font-weight:800;font-size:46px;line-height:1.18;margin-top:36px;max-width:960px;letter-spacing:-.4px}
.exp{margin-top:32px;font-weight:700;font-size:32px;color:#5b4690}
.chips{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.chip{background:#fff;border-radius:999px;padding:11px 22px;font-weight:800;font-size:29px;box-shadow:0 2px 10px rgba(12,36,71,.08);white-space:nowrap}
.cards{display:flex;gap:20px;margin-top:40px}
.card{border-radius:26px;padding:22px 28px;height:300px;display:flex;flex-direction:column;justify-content:space-between}
.c1{background:var(--orange);color:var(--navy);width:470px}
.c2{background:var(--blue);color:#fff;flex:1}
.big{font-family:AntonX,Impact,sans-serif;font-size:86px;line-height:1;letter-spacing:.5px;white-space:nowrap}
.big small{font-size:38px;margin-left:8px}
.txt{font-weight:800;font-size:33px;line-height:1.2}
.c2 .big{font-size:56px;line-height:1.05}
.c1 .big{font-size:80px}
.foot{position:absolute;left:66px;right:66px;bottom:34px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:25px;color:#5b4690}
.foot b{color:var(--navy);letter-spacing:1px}
</style></head><body>
<div class="rings"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="head"><img class="logo" src="logo_mark.png" alt="WAYU"><span class="div"></span><div class="org">Özbekiston<br>Yoşlari Umumjahon<em>Assotsiatsiyasi</em></div></div>
  <h1>FRANSIYADA <span>ISH</span></h1>
  <div class="sub">Pomidor teplitsasiga mavsumiy işçilar kerak, ariza 20-noyabrgaça</div>
  <div class="exp">Vakansiya şartlari:</div>
  <div class="chips"><span class="chip">6 oylik şartnoma</span><span class="chip">30–45 yoş</span><span class="chip">2 yil tajriba</span></div>
  <div class="cards">
    <div class="card c2" style="width:500px;flex:none"><div class="big">20-NOYABR</div><div class="txt">Ariza topşiriş muddati</div></div>
    <div class="card c1" style="width:auto;flex:1"><div class="big">1620 YEVRO</div><div class="txt">Oylik, qöliğa</div></div>
  </div>
  <div class="foot"><span></span><b>WAYU.UZ</b></div>
</div>
</body></html>
